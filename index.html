<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรวมคลังข้อสอบกฎหมาย</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS หลักสำหรับหน้าเมนู */
        :root {
            --menu-bg: #f4f7f6;
            --primary: #006341;
            --accent: #A29061;
            --white: #ffffff;
        }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--menu-bg); margin: 0; padding: 0; }
        .main-menu { text-align: center; padding: 50px 20px; max-width: 800px; margin: auto; }
        .menu-card { 
            background: var(--white); padding: 25px; margin: 15px; 
            border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer; transition: 0.3s; border-left: 8px solid var(--primary);
            display: flex; align-items: center; justify-content: space-between;
        }
        .menu-card:hover { transform: translateY(-5px); background: #eef7f3; }
        .menu-card h3 { margin: 0; color: var(--primary); }
        
        /* ส่วนควบคุมการแสดงผล */
        .quiz-container { display: none; padding: 20px; animation: fadeIn 0.5s; }
        .active { display: block; }
        .back-btn { 
            position: fixed; top: 10px; left: 10px; padding: 10px 20px; 
            background: #333; color: white; border: none; border-radius: 5px; 
            cursor: pointer; z-index: 1000;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* พื้นที่สำหรับใส่ CSS ของแต่ละไฟล์ (แยก Scope ด้วย ID) */
        #content-quiz1, #content-quiz2, #content-quiz3 { width: 100%; min-height: 100vh; }
    </style>
</head>
<body>

    <button id="backBtn" class="back-btn" style="display:none;" onclick="goHome()">⬅ กลับหน้าเมนู</button>

    <div id="home-screen" class="main-menu">
        <h1>📚 รวมแนวข้อสอบกฎหมาย</h1>
        <p>คลิกเลือกหัวข้อที่ต้องการทดสอบ</p>

        <div class="menu-card" onclick="startQuiz(1)">
            <h3>1. พ.ร.บ. พื้นที่นวัตกรรมการศึกษา 2562</h3>
            <span>➔</span>
        </div>

        <div class="menu-card" onclick="startQuiz(2)">
            <h3>2. พ.ร.บ. ระเบียบข้าราชการ กทม. 2554</h3>
            <span>➔</span>
        </div>

        <div class="menu-card" onclick="startQuiz(3)">
            <h3>3. พ.ร.บ. ข้อมูลข่าวสารของราชการ 2540</h3>
            <span>➔</span>
        </div>
    </div>

    <div id="quiz-screen" class="quiz-container">
        <iframe id="quizFrame" src="" style="width:100%; height:100vh; border:none;"></iframe>
    </div>

    <script>
        // เนื่องจากคุณมีไฟล์ HTML แยกกันอยู่แล้ว 
        // วิธีที่เสถียรที่สุดคือการเรียกผ่าน iframe หรือใส่ Code ลงใน Blob
        // แต่เพื่อความง่าย ผมจะใช้วิธีเปลี่ยน src ของ iframe

        function startQuiz(num) {
            const frame = document.getElementById('quizFrame');
            const home = document.getElementById('home-screen');
            const quizScreen = document.getElementById('quiz-screen');
            const backBtn = document.getElementById('backBtn');

            // กำหนดชื่อไฟล์ให้ตรงกับที่คุณมี
            let fileName = "";
            if(num === 1) fileName = "พ.ร.บ. พื้นที่นวัตกรรมการศึกษา พ.ศ. ๒๕๖๒.html";
            if(num === 2) fileName = "Quizพรบ.ศึกษา2562.html";
            if(num === 3) fileName = "quiz พรบ.ข้อมูลข่าวสาร2540 30ข้อ.html";

            frame.src = fileName;
            home.style.display = 'none';
            quizScreen.style.display = 'block';
            backBtn.style.display = 'block';
        }

        function goHome() {
            document.getElementById('home-screen').style.display = 'block';
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('quizFrame').src = ""; // reset frame
        }
    </script>
</body>
</html>
